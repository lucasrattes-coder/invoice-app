<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Generator Pro</title>
<style>
:root{--teal:#2dbfa7;--ink:#111827;--muted:#6b7280;--line:#c9ced6;--bg:#f6f7f9}
*{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:18px;padding:18px}.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px #0001}.panel h2{margin:0 0 12px}
label{display:block;font-size:12px;font-weight:700;margin-top:9px} input,textarea{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:14px} textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700;margin-top:12px;cursor:pointer}.btn2{background:#374151}.hint{font-size:12px;color:var(--muted)}
.page{background:#fff;width:210mm;min-height:297mm;margin:auto;padding:26mm 20mm;box-shadow:0 6px 30px #0002}.top{display:flex;justify-content:space-between;align-items:flex-start}.from{font-size:11pt;line-height:1.35}.from b{font-size:15pt}.title{text-align:right}.title h1{font-size:17pt;margin:0 0 12mm}.icon{width:36mm;height:36mm;border:5px solid var(--teal);border-radius:50%;margin-left:auto;position:relative}.icon:before{content:"";position:absolute;left:10mm;top:10mm;width:9mm;height:9mm;border:4px solid var(--teal);border-radius:50%}.icon:after{content:"";position:absolute;left:6mm;top:22mm;width:18mm;height:8mm;border:4px solid var(--teal);border-top:0;border-radius:0 0 18mm 18mm}.mid{display:flex;justify-content:space-between;margin-top:36mm}.bill,.meta{font-size:11pt;line-height:1.35}.meta{display:grid;grid-template-columns:auto 80px;gap:8px 16px}.meta b{text-align:right}.invoice-table{width:100%;border-collapse:collapse;margin-top:24mm}.invoice-table th{background:#f3f4f6;border:1px solid var(--line);font-size:10pt;padding:10px;text-align:center}.invoice-table td{border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;height:42mm;padding:10px;font-size:11pt;line-height:1.55}.invoice-table td.amount{text-align:right;width:36mm}.total{display:grid;grid-template-columns:1fr 36mm;margin-top:8px;font-size:14pt;font-weight:700}.total div:first-child{text-align:right;padding-right:16px}.signature{height:42mm;display:flex;justify-content:flex-end;align-items:center}.sig{font-family:cursive;font-size:38pt;transform:rotate(-10deg);color:#111}.terms{position:absolute;bottom:24mm;font-size:11pt;line-height:1.4}.pagewrap{position:relative;min-height:245mm}.footer{position:absolute;bottom:0;right:0;color:#c0c0c0;font-size:9pt}@media(max-width:1000px){.wrap{display:block}.panel{margin-bottom:14px}.page{transform:scale(.48);transform-origin:top left;margin:0;width:210mm}.preview{height:145mm;overflow:hidden}}
@media print{body{background:#fff}.panel{display:none}.wrap{display:block;padding:0}.page{box-shadow:none;margin:0;padding:26mm 20mm}.preview{height:auto;overflow:visible}@page{size:A4;margin:0}}
</style></head><body><div class="wrap"><div class="panel"><h2>Invoice Generator Pro</h2><p class="hint">Preencha aqui e clique em Gerar PDF. Funciona sem app pago.</p>
<label>Invoice #</label><input id="invNo" value="113"><label>Invoice Date</label><input id="invDate" value="03/05/2026"><label>Seu nome</label><input id="yourName" value="Lucas Rattes Mendonca"><label>Seu endereço</label><textarea id="yourAddr">33 Sandringham Rd
Thornton Heath
CR7 7AX</textarea><label>Cliente</label><textarea id="client">GP Transport & Logistic Ltd
Flat 3
53 Kingsmead Avenue
CR4 1ES</textarea><label>Round / Serviço</label><input id="round" value="Round 114"><label>Preço por stop (£)</label><input id="price" value="3.60"><label>Total manual opcional (£)</label><input id="manual" value="800.00"><label>Dias / Stops / Area</label><div id="lines"></div><button class="btn btn2" onclick="addLine()">+ linha</button><hr><label>Pagamento</label><textarea id="pay">Payment is due within bank transfer
Lucas Mendonca
Sort Code 30-91-83
Account Number 48274460</textarea><button class="btn" onclick="render(); window.print()">Gerar PDF</button><button class="btn btn2" onclick="render()">Atualizar preview</button><p class="hint">No iPhone: depois do preview de impressão, use Compartilhar > Salvar em Arquivos.</p></div><div class="preview"><div class="page"><div class="pagewrap" id="page"></div></div></div></div>
<script>
const esc=s=>String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])).replace(/\n/g,'<br>');
function addLine(d='',s='',a=''){let div=document.createElement('div');div.className='row';div.innerHTML=`<input placeholder="Date" value="${d}"><input placeholder="Stops" value="${s}"><input placeholder="Area" value="${a}">`;document.getElementById('lines').appendChild(div)}
[['13/04','81','CR2/6'],['15/04','72','SM6/6'],['16/04','69','SM/CR']].forEach(x=>addLine(...x));
function getLines(){return [...document.querySelectorAll('#lines .row')].map(r=>[...r.children].map(i=>i.value)).filter(x=>x.some(Boolean))}
function money(n){return '£'+Number(n||0).toFixed(2)}
function render(){let lines=getLines(), price=parseFloat(document.getElementById('price').value)||0;let stops=lines.reduce((a,x)=>a+(parseFloat(x[1])||0),0);let calc=stops*price;let manual=document.getElementById('manual').value.trim();let total=manual?parseFloat(manual):calc;let desc=esc(document.getElementById('round').value)+'<br><br>'+lines.map(x=>`${esc(x[0])} - ${esc(x[1])} stops (${esc(x[2])})`).join('<br>')+`<br><br>£${price.toFixed(2)}/stop`;document.getElementById('page').innerHTML=`<div class="top"><div class="from"><b>${esc(yourName.value)}</b><br><br>${esc(yourAddr.value)}</div><div class="title"><h1>INVOICE</h1><div class="icon"></div></div></div><div class="mid"><div class="bill"><b>Bill To</b><br>${esc(client.value)}</div><div class="meta"><b>Invoice #</b><span>${esc(invNo.value)}</span><b>Invoice Date</b><span>${esc(invDate.value)}</span></div></div><table class="invoice-table"><tr><th>DESCRIPTION</th><th>AMOUNT</th></tr><tr><td>${desc}</td><td class="amount">${Number(total).toFixed(2)}</td></tr></table><div class="total"><div>TOTAL</div><div>${money(total)}</div></div><div class="signature"><div class="sig">LRM</div></div><div class="terms"><b>Terms & Conditions</b><br>${esc(pay.value)}</div><div class="footer">Generated automatically</div>`}
render();
</script></body></html>
